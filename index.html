<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>บ้านทุเรียนชาววัง | AI Smart Cooler</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 1536px;
      line-height: 0;
    }

    /* ภาพหน้าแรก */
    .background {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      พื้นที่กดแบบโปร่งใส
      ไม่แสดงข้อความหรือสีใด ๆ
      เพราะข้อความและปุ่มอยู่ในภาพพื้นหลังแล้ว
    */

    .button {
      position: absolute;
      display: block;
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ปุ่มที่ 1 : ประวัติร้าน */
    .history {
      left: 5.5%;
      top: 40.8%;
      width: 89%;
      height: 8.3%;
    }

    /* ปุ่มที่ 2 : ดูวิธีใช้ */
    .how-to-use {
      left: 5.5%;
      top: 49.6%;
      width: 89%;
      height: 8.4%;
    }

    /* ปุ่มที่ 3 : สนใจแฟรนไชส์ */
    .franchise {
      left: 5.5%;
      top: 58.5%;
      width: 89%;
      height: 8.4%;
    }

    /* ป้องกันการลากภาพ */
    img {
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- ภาพหน้าแรก -->
    <img
      class="background"
      src="home-background.png.png"
      alt="บ้านทุเรียนชาววัง AI Smart Cooler"
    >

    <!-- 1. ประวัติร้าน : ยังไม่ใส่ลิงก์ -->
    <a
      class="button history"
      href="javascript:void(0);"
      aria-label="ประวัติร้าน"
    ></a>

    <!-- 2. ดูวิธีใช้ : เปิด TikTok -->
    <a
      class="button how-to-use"
      href="https://vt.tiktok.com/ZSVcSqv4H/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ดูวิธีใช้"
    ></a>

    <!-- 3. สนใจแฟรนไชส์ : ยังไม่ใส่ลิงก์ -->
    <a
      class="button franchise"
      href="javascript:void(0);"
      aria-label="สนใจแฟรนไชส์"
    ></a>

  </main>

</body>
</html>
