<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>บ้านทุเรียนชาววัง | AI Smart Cooler</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      min-height: 100vh;
      background: #123f28;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(
          rgba(0, 45, 25, 0.30),
          rgba(0, 45, 25, 0.50)
        ),
        url("home-background.png.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .content {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .logo-title {
      color: white;
      text-shadow: 0 3px 8px rgba(0,0,0,0.55);
      margin-bottom: 25px;
    }

    .logo-title h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 58px);
      font-weight: 800;
    }

    .logo-title p {
      margin: 8px 0 0;
      font-size: clamp(16px, 4vw, 24px);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu-button {
      width: 100%;
      min-height: 92px;

      display: flex;
      align-items: center;

      padding: 10px 18px;

      border-radius: 48px;

      border: 3px solid #d6ad45;

      background: linear-gradient(
        100deg,
        #0b4d2d,
        #17643b
      );

      color: white;
      text-decoration: none;

      box-shadow:
        0 8px 18px rgba(0,0,0,0.40),
        inset 0 2px 3px rgba(255,255,255,0.25);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .menu-button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 12px 25px rgba(0,0,0,0.45),
        inset 0 2px 4px rgba(255,255,255,0.30);
    }

    .menu-button:active {
      transform: translateY(2px);
      box-shadow:
        0 4px 10px rgba(0,0,0,0.35);
    }

    .menu-button.gold {
      background: linear-gradient(
        100deg,
        #b77a00,
        #e0ad21,
        #b77a00
      );
    }

    .icon {
      width: 65px;
      height: 65px;
      min-width: 65px;

      border-radius: 50%;

      border: 2px solid white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 31px;

      background: rgba(0,0,0,0.16);
    }

    .text {
      flex: 1;
      text-align: left;
      padding-left: 18px;
    }

    .number {
      font-size: 15px;
      opacity: 0.9;
      margin-bottom: 2px;
    }

    .title {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      line-height: 1.2;
    }

    .arrow {
      width: 45px;
      height: 45px;

      border-radius: 50%;

      background: rgba(255,255,255,0.92);
      color: #14502f;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
      font-weight: bold;
    }

    .footer {
      margin-top: 25px;
      color: white;
      font-size: 14px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6);
    }

    @media (max-width: 480px) {

      .page {
        padding: 18px 12px;
      }

      .logo-title {
        margin-bottom: 20px;
      }

      .menu {
        gap: 12px;
      }

      .menu-button {
        min-height: 78px;
        padding: 8px 12px;
        border-width: 2px;
      }

      .icon {
        width: 54px;
        height: 54px;
        min-width: 54px;
        font-size: 25px;
      }

      .text {
        padding-left: 12px;
      }

      .number {
        font-size: 12px;
      }

      .title {
        font-size: 21px;
      }

      .arrow {
        width: 38px;
        height: 38px;
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="content">

      <div class="logo-title">
        <h1>บ้านทุเรียนชาววัง</h1>
        <p>PREMIUM FRUIT • FRESH EVERY DAY</p>
      </div>

      <div class="menu">

        <!-- ปุ่มที่ 1 : ยังไม่มีลิงก์ -->
        <button class="menu-button" type="button">
          <div class="icon">🏪</div>

          <div class="text">
            <div class="number">1.</div>
            <div class="title">ประวัติร้าน</div>
          </div>

          <div class="arrow">›</div>
        </button>


        <!-- ปุ่มที่ 2 : ไป TikTok -->
        <a
          class="menu-button gold"
          href="https://vt.tiktok.com/ZSVcSqv4H/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="icon">▶</div>

          <div class="text">
            <div class="number">2.</div>
            <div class="title">ดูวิธีใช้</div>
          </div>

          <div class="arrow">›</div>
        </a>


        <!-- ปุ่มที่ 3 : ยังไม่มีลิงก์ -->
        <button class="menu-button" type="button">
          <div class="icon">🤝</div>

          <div class="text">
            <div class="number">3.</div>
            <div class="title">สนใจแฟรนไชส์</div>
          </div>

          <div class="arrow">›</div>
        </button>

      </div>

      <div class="footer">
        AI SMART COOLER
        <br>
        สะดวก • ปลอดภัย • พร้อมบริการคุณ
      </div>

    </section>

  </main>

</body>
</html>
