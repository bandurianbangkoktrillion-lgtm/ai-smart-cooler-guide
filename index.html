<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>บ้านทุเรียนชาววัง | AI Smart Cooler</title>

<style>

/* =========================
   พื้นฐาน
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #ffffff;
}

body {
    font-family: Arial, "Noto Sans Thai", sans-serif;
    display: flex;
    justify-content: center;
}

/* =========================
   พื้นที่หลัก
   อัตราส่วนเดียวกับภาพ Background
========================= */

.page {
    position: relative;
    width: 100%;
    max-width: 768px;
    line-height: 0;
}

/* =========================
   ภาพ Background
========================= */

.background {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
}

/* =========================
   ชั้นปุ่มลอย
========================= */

.button-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* =========================
   แผ่นใสสำหรับกด
========================= */

.hotspot {
    position: absolute;

    /*
      สำคัญ:
      ขนาดและตำแหน่งเป็น %
      จึงจะย่อ/ขยายตาม Background
    */

    left: 5.5%;
    width: 89%;

    pointer-events: auto;
    cursor: pointer;

    border-radius: 6vw;

    /*
      แผ่นใส
    */
    background: rgba(255, 255, 255, 0.045);

    /*
      ขอบทองบาง ๆ
    */
    border: 2px solid rgba(255, 220, 100, 0.60);

    /*
      เงาให้ดูเหมือนปุ่มลอย
    */
    box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.25),
        inset 0 0 12px rgba(255, 255, 255, 0.10);

    /*
      ทำให้แผ่นใสดูมีมิติ
    */
    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;

    overflow: hidden;
}

/* =========================
   แสงวิ่งบนปุ่ม
========================= */

.hotspot::after {
    content: "";
    position: absolute;

    top: 0;
    left: -120%;

    width: 55%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.28),
        transparent
    );

    transform: skewX(-20deg);

    animation: shine 4.5s infinite;
}

@keyframes shine {

    0% {
        left: -120%;
    }

    35% {
        left: 140%;
    }

    100% {
        left: 140%;
    }
}

/* =========================
   ตอนเอานิ้วแตะ
========================= */

.hotspot:active {
    transform: scale(0.985);

    background: rgba(255, 255, 255, 0.16);

    box-shadow:
        0 2px 7px rgba(0,0,0,0.25),
        inset 0 0 18px rgba(255,255,255,0.25);
}

/* =========================
   ปุ่มที่ 1
   ประวัติร้าน
========================= */

.history {
    top: 45.0%;
    height: 8.7%;
}

/* =========================
   ปุ่มที่ 2
   ดูวิธีใช้
========================= */

.howto {
    top: 82.0%;
    height: 11%;
}

/* =========================
   ปุ่มที่ 3
   สนใจแฟรนไชส์
========================= */

.franchise {
    top: 63.0%;
    height: 8.7%;
}

/* =========================
   รองรับมือถือจอแคบ
========================= */

@media (max-width: 480px) {

    .hotspot {
        border-width: 1.5px;
    }

}

/* =========================
   รองรับคอมพิวเตอร์
========================= */

@media (min-width: 769px) {

    .page {
        max-width: 768px;
    }

    .hotspot {
        border-radius: 46px;
    }

}

</style>
</head>

<body>

<div class="page">

    <!-- ภาพ Background หลัก -->
    <img
        src="home-background.png.png"
        class="background"
        alt="บ้านทุเรียนชาววัง AI Smart Cooler"
    >

    <!-- ชั้นปุ่มลอย -->
    <div class="button-layer">

        <!-- 1. ประวัติร้าน -->
        <div
            class="hotspot history"
            onclick="historyButton()"
            aria-label="ประวัติร้าน">
        </div>

        <!-- 2. ดูวิธีใช้ -->
        <div
            class="hotspot howto"
            onclick="howToButton()"
            aria-label="ดูวิธีใช้">
        </div>

        <!-- 3. สนใจแฟรนไชส์ -->
        <div
            class="hotspot franchise"
            onclick="franchiseButton()"
            aria-label="สนใจแฟรนไชส์">
        </div>

    </div>

</div>


<script>

/* ===================================
   ปุ่ม 1 : ประวัติร้าน
   ยังไม่ใส่ลิงก์
=================================== */

function historyButton() {

    // ยังไม่กำหนดลิงก์
    console.log("กดปุ่ม ประวัติร้าน");

}


/* ===================================
   ปุ่ม 2 : ดูวิธีใช้
   TikTok
=================================== */

function howToButton() {

    window.open(
        "https://vt.tiktok.com/ZSVcSqv4H/",
        "_blank"
    );

}


/* ===================================
   ปุ่ม 3 : สนใจแฟรนไชส์
   ยังไม่ใส่ลิงก์
=================================== */

function franchiseButton() {

    // ยังไม่กำหนดลิงก์
    console.log("กดปุ่ม สนใจแฟรนไชส์");

}

</script>

</body>
</html>
