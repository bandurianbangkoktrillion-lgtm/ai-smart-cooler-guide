<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>บ้านทุเรียนชาววัง | AI Smart Cooler</title>

  <style>
    /* ==============================
       ตั้งค่าพื้นฐาน
       ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #ffffff;
    }

    body {
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }


    /* ==============================
       กล่องหลัก
       ============================== */

    .container {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }


    /* ==============================
       ภาพหน้าแรก
       ============================== */

    .background {
      display: block;
      width: 100%;
      height: auto;
    }


    /* ==============================
       พื้นที่ปุ่มแบบโปร่งใส
       ไม่มีสี ไม่มีข้อความ
       ============================== */

    .menu-button {
      position: absolute;
      left: 5.5%;
      width: 89%;
      height: 12.5%;

      display: block;

      background: transparent;
      border: none;

      z-index: 10;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }


    /* ==============================
       ตำแหน่งปุ่มทั้ง 3
       อ้างอิงจากภาพ home.png
       ============================== */

    /* ปุ่มที่ 1 : ประวัติร้าน */
    #btn-history {
      top: 48.0%;
    }


    /* ปุ่มที่ 2 : ดูวิธีใช้ */
    #btn-howto {
      top: 60.5%;
    }


    /* ปุ่มที่ 3 : สนใจแฟรนไชส์ */
    #btn-franchise {
      top: 73.0%;
    }


    /* ==============================
       ปรับตำแหน่งสำหรับมือถือ
       ============================== */

    @media (max-width: 768px) {

      .menu-button {
        left: 5%;
        width: 90%;
        height: 12.5%;
      }

      #btn-history {
        top: 48.0%;
      }

      #btn-howto {
        top: 60.5%;
      }

      #btn-franchise {
        top: 73.0%;
      }
    }


    /* ==============================
       ปรับสำหรับมือถือจอแคบมาก
       ============================== */

    @media (max-width: 480px) {

      .menu-button {
        left: 5%;
        width: 90%;
        height: 12.5%;
      }

      #btn-history {
        top: 48.0%;
      }

      #btn-howto {
        top: 60.5%;
      }

      #btn-franchise {
        top: 73.0%;
      }
    }

  </style>
</head>


<body>

  <div class="container">

    <!-- =================================
         ภาพหน้าแรกของ บ้านทุเรียนชาววัง
         ================================= -->

    <img
      src="home.png"
      class="background"
      alt="บ้านทุเรียนชาววัง AI Smart Cooler"
    >


    <!-- =================================
         ปุ่มโปร่งใสที่ 1
         ประวัติร้าน
         ตอนนี้ยังไม่มีลิงก์
         ================================= -->

    <a
      id="btn-history"
      class="menu-button"
      href="javascript:void(0);"
      aria-label="ประวัติร้าน"
    ></a>


    <!-- =================================
         ปุ่มโปร่งใสที่ 2
         ดูวิธีใช้
         เปิด TikTok
         ================================= -->

    <a
      id="btn-howto"
      class="menu-button"
      href="https://vt.tiktok.com/ZSVcSqv4H/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="ดูวิธีใช้"
    ></a>


    <!-- =================================
         ปุ่มโปร่งใสที่ 3
         สนใจแฟรนไชส์
         ตอนนี้ยังไม่มีลิงก์
         ================================= -->

    <a
      id="btn-franchise"
      class="menu-button"
      href="javascript:void(0);"
      aria-label="สนใจแฟรนไชส์"
    ></a>

  </div>

</body>
</html>
